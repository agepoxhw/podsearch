# The official chart has one Service for all SeaweedFS ports. This extra Service exposes only S3
# on the fixed NodePort 30333, which k3d maps to localhost:8333. Selector = the chart's pod labels.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seaweedfs-all-in-one
  ports:
    - {name: s3, port: 8333, targetPort: 8333, nodePort: 30333}
