{{- /* The query embedder: loads the text model, answers POST /embed. One replica, Recreate: a rolling surge
       would need a second model copy (~5 GiB) that does not fit, so the pod would stay Pending.
       Cost: about 60 s without search on each deploy; the API answers 503 + Retry-After meanwhile. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: embedder}}
  template:
    metadata:
      labels: {app: embedder}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: embedder
          image: {{ required "set images.mlText (make up passes it)" .Values.images.mlText }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, podsearch.embed.server]
          env:
            - {name: OMP_NUM_THREADS, value: "2"}          # = the CPU limit; torch.set_num_threads uses EMBED_THREADS
            - {name: EMBED_THREADS, value: "2"}
          ports: [{containerPort: 8000, name: http}]
          resources: {{- toYaml .Values.embedder.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          # Model load takes ~47 s and competes for CPU with the speech worker: allow 180 s before giving up.
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 3}
---
apiVersion: v1
kind: Service
metadata:
  name: embedder
spec:
  selector: {app: embedder}
  ports: [{name: http, port: 8000, targetPort: http}]
