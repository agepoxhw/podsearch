# Two small Services, because the chart's own is named `rustfs-svc` and also exposes the console:
#  * rustfs      ClusterIP :9000  the stable in-cluster S3 endpoint (matches S3_ENDPOINT)
#  * rustfs-s3   NodePort 30333   k3d maps it to localhost:8333 for host-side tools
# Selector = the chart's pod labels.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: {app.kubernetes.io/name: rustfs, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: s3, port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-s3
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: rustfs, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: s3, port: 9000, targetPort: 9000, nodePort: 30333}]
