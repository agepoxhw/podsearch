# Values grow with each phase.
clusterName: podsearch

# Sub-chart values: each key must match a dependency name in Chart.yaml.

# SeaweedFS (official chart) in all-in-one mode = a single `weed server -filer -s3` pod.
seaweedfs:
  fullnameOverride: seaweedfs
  master: {enabled: false}    # all-in-one replaces the separate master/volume/filer pods
  volume: {enabled: false}
  filer: {enabled: false}
  allInOne:
    enabled: true
    s3:
      enabled: true
      enableAuth: true
      createBuckets:
        - name: podcasts
    data:
      type: persistentVolumeClaim
      size: 10Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  s3:
    # Reuse the Secret that `make up` generates once (keys access_key / secret_key).
    credentials:
      admin:
        existingSecret: s3-credentials
        accessKeyKey: access_key
        secretKeyKey: secret_key

qdrant:
  fullnameOverride: qdrant          # stable Service name: qdrant:6333
  replicaCount: 1
  persistence:
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Our own images. No defaults on purpose: `make up` passes the content-hash tags from
# .build/images.env, and the chart fails if they are missing (never a stale or `latest` image).
images:
  mlBase: ""
  mlSpeech: ""

# Ray cluster (the CR is rendered by templates/raycluster.yaml; KubeRay turns it into pods).
ray:
  head:
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "1", memory: 2Gi}
  worker:
    minReplicas: 1
    maxReplicas: 2
    resources:               # placeholder: tuned from a measured speech-only worker
      requests: {cpu: "3", memory: 8Gi}
      limits: {cpu: "4", memory: 12Gi}
  autoscaler:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 200m, memory: 256Mi}

kuberay-operator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 512Mi}

# Small helper image with aws-cli, used by the toolbox pod.
awscli:
  image: amazon/aws-cli:2.38.4
